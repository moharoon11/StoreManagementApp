    <circle cx="24" cy="29" r="8" fill="#CDB89A"/>
    <text class="panelBody" x="42" y="34">Search products, invoices, or tasks</text>
    <rect x="516" y="8" width="112" height="42" rx="21" fill="#1F2428"/>
    <text class="chip" x="572" y="34" text-anchor="middle" fill="#F6F0E7">NEW SALE</text>
    <text class="small" x="0" y="76">Friday, September 11</text>
    <text class="panelTitle" x="0" y="106">The workspace opens directly here after login.</text>
    <text class="panelBody" x="0" y="128">No welcome step, no extra tap. The app starts on a clearer command view.</text>

    <g filter="url(#softShadow)">
