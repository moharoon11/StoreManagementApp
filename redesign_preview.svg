<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" fill="none">
  <defs>
    <linearGradient id="bg" x1="120" y1="40" x2="1480" y2="1120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6F0E7"/>
      <stop offset="1" stop-color="#E8E0D2"/>
    </linearGradient>
    <linearGradient id="hero" x1="540" y1="210" x2="1180" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A2F35"/>
      <stop offset="1" stop-color="#454038"/>
    </linearGradient>
    <linearGradient id="mobileHero" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#23313A"/>
      <stop offset="1" stop-color="#55685B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#6D5B46" flood-opacity="0.14"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#4B3C2B" flood-opacity="0.08"/>
    </filter>
    <style>
      .eyebrow { font: 700 14px Arial, sans-serif; letter-spacing: 3px; fill: #8A6A46; }
      .heroTitle { font: 700 52px Georgia, "Times New Roman", serif; fill: #1E2326; }
      .lead { font: 400 18px Arial, sans-serif; fill: #5E615D; }
      .small { font: 600 13px Arial, sans-serif; fill: #7A746B; }
      .chip { font: 700 12px Arial, sans-serif; fill: #1F2428; }
      .frameLabel { font: 700 14px Arial, sans-serif; fill: #615F58; letter-spacing: 1px; }
      .navText { font: 600 13px Arial, sans-serif; fill: #C7C0B3; }
      .navTextSelected { font: 700 13px Arial, sans-serif; fill: #1E2326; }
      .sectionTitle { font: 700 28px Georgia, "Times New Roman", serif; fill: #FAF5EE; }
      .sectionNote { font: 400 14px Arial, sans-serif; fill: #D9D3C8; }
      .panelTitle { font: 700 18px Georgia, "Times New Roman", serif; fill: #1E2326; }
      .panelBody { font: 400 13px Arial, sans-serif; fill: #706A62; }
      .metricLabel { font: 700 11px Arial, sans-serif; letter-spacing: 1.3px; fill: #867F74; }
      .metricValue { font: 700 28px Georgia, "Times New Roman", serif; fill: #1E2326; }
      .metricNote { font: 600 12px Arial, sans-serif; fill: #667868; }
      .listTitle { font: 700 13px Arial, sans-serif; fill: #1F2427; }
      .listMeta { font: 400 12px Arial, sans-serif; fill: #7B756B; }
      .price { font: 700 17px Georgia, "Times New Roman", serif; fill: #1E2326; }
      .stock { font: 700 11px Arial, sans-serif; fill: #5A725E; }
      .mobileHeading { font: 700 20px Georgia, "Times New Roman", serif; fill: #F8F2EA; }
      .mobileText { font: 400 12px Arial, sans-serif; fill: #E5DED3; }
      .mobileDark { font: 700 13px Arial, sans-serif; fill: #1E2326; }
      .mobileMuted { font: 400 11px Arial, sans-serif; fill: #726B61; }
    </style>
  </defs>

  <rect width="1600" height="1180" fill="url(#bg)"/>
  <circle cx="150" cy="145" r="110" fill="#FFFFFF" opacity="0.38"/>
  <circle cx="1420" cy="1040" r="160" fill="#DCCAAF" opacity="0.25"/>
  <circle cx="1360" cy="120" r="150" fill="#F5EADD" opacity="0.65"/>

  <g transform="translate(88 90)">
    <text class="eyebrow">REDESIGN PREVIEW</text>
    <text class="heroTitle" x="0" y="68">Nexora Commerce, reimagined.</text>
    <text class="lead" x="0" y="112">A calmer, more premium workspace with direct entry, stronger hierarchy,</text>
    <text class="lead" x="0" y="140">and safer responsive catalogue screens that do not squeeze product cards.</text>

    <g transform="translate(0 178)">
      <rect x="0" y="0" width="180" height="38" rx="19" fill="#1F2428"/>
      <text class="chip" x="90" y="24" text-anchor="middle" fill="#F7F2EA">WELCOME SCREEN REMOVED</text>
    </g>
    <g transform="translate(194 178)">
      <rect x="0" y="0" width="170" height="38" rx="19" fill="#F0E4D1" stroke="#D1C2AD"/>
      <text class="chip" x="85" y="24" text-anchor="middle" fill="#846341">EDITORIAL LAYOUT</text>
    </g>
    <g transform="translate(378 178)">
      <rect x="0" y="0" width="190" height="38" rx="19" fill="#E4ECE5" stroke="#B6C4B8"/>
      <text class="chip" x="95" y="24" text-anchor="middle" fill="#496051">RESPONSIVE PRODUCT GRID</text>
    </g>

    <text class="frameLabel" x="0" y="282">Palette</text>
    <g transform="translate(0 300)">
      <rect x="0" y="0" width="72" height="20" rx="10" fill="#1F2428"/>
      <rect x="84" y="0" width="72" height="20" rx="10" fill="#F7F2EA"/>
      <rect x="168" y="0" width="72" height="20" rx="10" fill="#A67C52"/>
      <rect x="252" y="0" width="72" height="20" rx="10" fill="#607567"/>
      <rect x="336" y="0" width="72" height="20" rx="10" fill="#D8CEBF"/>
    </g>
  </g>

  <text class="frameLabel" x="324" y="132">DESKTOP HOME</text>
