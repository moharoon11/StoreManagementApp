        <rect x="14" y="14" width="152" height="92" rx="18" fill="#EFE7DA"/>
        <rect x="26" y="32" width="56" height="56" rx="18" fill="#D9BCA4"/>
        <text class="listTitle" x="14" y="128">House Blend Coffee</text>
        <text class="listMeta" x="14" y="148">500 g premium roast</text>
        <text class="price" x="14" y="173">Rs 460</text>
        <rect x="116" y="155" width="50" height="24" rx="12" fill="#F4E5DF"/>
        <text class="stock" x="141" y="171" text-anchor="middle" fill="#9B5D4B">2 left</text>
