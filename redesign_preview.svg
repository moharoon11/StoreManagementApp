      <text class="listMeta" x="200" y="65">Rs 4,820</text>
      <rect x="18" y="86" width="256" height="34" rx="14" fill="#FBF8F2"/>
      <text class="listTitle" x="32" y="107">INV-2090   Walk-in billing</text>
      <text class="listMeta" x="200" y="107">Rs 1,360</text>
      <rect x="18" y="128" width="256" height="20" rx="10" fill="#E8EFE8"/>
      <text class="chip" x="75" y="142" text-anchor="middle" fill="#4B6151">SYNCED AND READY</text>
    </g>

    <g transform="translate(308 398)">
