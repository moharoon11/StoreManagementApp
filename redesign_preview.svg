    <text class="panelTitle" x="0" y="28">Browse faster on mobile</text>
    <rect x="0" y="48" width="202" height="110" rx="26" fill="url(#mobileHero)"/>
    <text class="mobileHeading" x="18" y="82">Open straight to work.</text>
    <text class="mobileText" x="18" y="104">No welcome screen. Filters stay reachable.</text>
    <rect x="18" y="118" width="86" height="26" rx="13" fill="#ECE0CC"/>
    <text class="chip" x="61" y="136" text-anchor="middle" fill="#465748">IN STOCK</text>

    <rect x="0" y="176" width="202" height="34" rx="17" fill="#FFFFFF" stroke="#D8CEBF"/>
    <text class="panelBody" x="18" y="198">Search products</text>

    <rect x="0" y="226" width="64" height="28" rx="14" fill="#EFE2CD"/>
    <text class="chip" x="32" y="244" text-anchor="middle" fill="#7E613C">Tea</text>
    <rect x="72" y="226" width="82" height="28" rx="14" fill="#FBF8F2" stroke="#D8CEBF"/>
    <text class="chip" x="113" y="244" text-anchor="middle" fill="#635E57">Coffee</text>
    <rect x="162" y="226" width="40" height="28" rx="14" fill="#FBF8F2" stroke="#D8CEBF"/>
    <text class="chip" x="182" y="244" text-anchor="middle" fill="#635E57">All</text>

    <g transform="translate(0 270)">
