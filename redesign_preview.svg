    <text class="chip" x="85" y="257" text-anchor="middle" fill="#5E4529">CREATE INVOICE</text>
    <rect x="156" y="232" width="122" height="40" rx="20" fill="#314036"/>
    <text class="chip" x="217" y="257" text-anchor="middle" fill="#EAF0EB">REVIEW STOCK</text>
    <text class="sectionNote" x="512" y="191">Today</text>
    <text class="sectionTitle" x="512" y="223">Rs 42,650</text>
