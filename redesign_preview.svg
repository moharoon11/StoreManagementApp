        <rect x="14" y="14" width="152" height="92" rx="18" fill="#EFE7DA"/>
        <rect x="26" y="32" width="56" height="56" rx="18" fill="#D8C5AB"/>
        <text class="listTitle" x="14" y="128">Cold Brew Bottle</text>
        <text class="listMeta" x="14" y="148">350 ml glass bottle</text>
        <text class="price" x="14" y="173">Rs 220</text>
        <rect x="116" y="155" width="50" height="24" rx="12" fill="#E8EFE8"/>
        <text class="stock" x="141" y="171" text-anchor="middle">8 left</text>
      </g>
      <g transform="translate(194 0)">
        <rect width="180" height="188" rx="22" fill="#FFFFFF" stroke="#D8CEBF"/>
        <rect x="14" y="14" width="152" height="92" rx="18" fill="#EEE5D5"/>
        <rect x="26" y="32" width="56" height="56" rx="18" fill="#C7D4CC"/>
        <text class="listTitle" x="14" y="128">Green Tea Pack</text>
        <text class="listMeta" x="14" y="148">25 sachets</text>
        <text class="price" x="14" y="173">Rs 180</text>
        <rect x="116" y="155" width="50" height="24" rx="12" fill="#E8EFE8"/>
        <text class="stock" x="141" y="171" text-anchor="middle">14 left</text>
      </g>
      <g transform="translate(388 0)">
