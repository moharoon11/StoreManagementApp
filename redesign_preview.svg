      <text class="panelTitle" x="18" y="28">Stock watch</text>
      <rect x="18" y="44" width="116" height="26" rx="13" fill="#F5EEE2"/>
      <text class="listTitle" x="30" y="61">Masala Tea</text>
      <text class="listMeta" x="30" y="85">5 boxes left</text>
      <rect x="18" y="98" width="116" height="26" rx="13" fill="#F0F5F1"/>
