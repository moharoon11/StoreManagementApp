    <g transform="translate(18 172)">
      <circle cx="20" cy="14" r="9" fill="#36404C"/>
      <text class="navText" x="40" y="19">Sell</text>
      <circle cx="20" cy="54" r="9" fill="#36404C"/>
      <text class="navText" x="40" y="59">Products</text>
      <circle cx="20" cy="94" r="9" fill="#36404C"/>
      <text class="navText" x="40" y="99">Categories</text>
      <circle cx="20" cy="134" r="9" fill="#36404C"/>
      <text class="navText" x="40" y="139">Invoices</text>
      <circle cx="20" cy="174" r="9" fill="#36404C"/>
      <text class="navText" x="40" y="179">Stock</text>
      <circle cx="20" cy="214" r="9" fill="#36404C"/>
      <text class="navText" x="40" y="219">Insights</text>
      <circle cx="20" cy="254" r="9" fill="#36404C"/>
      <text class="navText" x="40" y="259">Business</text>
    </g>
    <rect x="18" y="316" width="178" height="48" rx="18" fill="#2A322E"/>
    <text class="listMeta" x="36" y="338" fill="#C8D4CA">Low stock warning</text>
    <text class="listTitle" x="36" y="357" fill="#EFF6F0">4 items need attention</text>
  </g>

  <g transform="translate(602 198)">
