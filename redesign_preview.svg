    <g transform="translate(22 486)">
      <rect width="158" height="52" rx="26" fill="#1F2428"/>
      <circle cx="26" cy="26" r="8" fill="#A67C52"/>
      <circle cx="62" cy="26" r="8" fill="#D8CEBF"/>
      <circle cx="98" cy="26" r="8" fill="#D8CEBF"/>
      <circle cx="134" cy="26" r="8" fill="#D8CEBF"/>
      <rect x="16" y="8" width="20" height="36" rx="10" fill="#EDE1CE" opacity="0.14"/>
    </g>
  </g>

  <g transform="translate(1270 770)">
    <text class="frameLabel" x="0" y="0">Implementation plan after approval</text>
    <text class="lead" x="0" y="34">1. Remove the welcome route and land directly on Home.</text>
    <text class="lead" x="0" y="64">2. Rebuild the app shell, navigation, spacing, and visual system.</text>
    <text class="lead" x="0" y="94">3. Refactor catalogue, POS, reports, invoices, stock, and profile screens</text>
    <text class="lead" x="0" y="122">   so they reflow cleanly on phones, tablets, and desktop.</text>
    <text class="lead" x="0" y="160">4. Fix the categories/products UI crash by using safer layout constraints</text>
    <text class="lead" x="0" y="188">   and more stable card sizing.</text>
  </g>
</svg>
