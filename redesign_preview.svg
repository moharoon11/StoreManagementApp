      <rect x="14" y="14" width="62" height="66" rx="18" fill="#EFE7DA"/>
      <text class="mobileDark" x="92" y="32">Cold Brew Bottle</text>
      <text class="mobileMuted" x="92" y="51">350 ml</text>
      <text class="price" x="92" y="78">Rs 220</text>
      <rect x="150" y="56" width="34" height="24" rx="12" fill="#E8EFE8"/>
      <text class="stock" x="167" y="72" text-anchor="middle">8</text>
    </g>
    <g transform="translate(0 376)">
      <rect width="202" height="94" rx="22" fill="#FFFFFF" stroke="#D8CEBF"/>
      <rect x="14" y="14" width="62" height="66" rx="18" fill="#EEE5D5"/>
      <text class="mobileDark" x="92" y="32">Green Tea Pack</text>
      <text class="mobileMuted" x="92" y="51">25 sachets</text>
      <text class="price" x="92" y="78">Rs 180</text>
      <rect x="150" y="56" width="34" height="24" rx="12" fill="#E8EFE8"/>
      <text class="stock" x="167" y="72" text-anchor="middle">14</text>
