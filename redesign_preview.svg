      <path d="M22 126 C52 96, 72 112, 96 86 S138 70, 130 48" stroke="#607567" stroke-width="4" stroke-linecap="round"/>
      <circle cx="22" cy="126" r="5" fill="#607567"/>
      <circle cx="54" cy="101" r="5" fill="#607567"/>
      <circle cx="87" cy="94" r="5" fill="#607567"/>
      <circle cx="120" cy="60" r="5" fill="#A67C52"/>
      <text class="listMeta" x="18" y="148">Last 7 days</text>
    </g>

    <g transform="translate(476 398)">
