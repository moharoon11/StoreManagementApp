    <rect x="18" y="18" width="178" height="76" rx="20" fill="#2B313A"/>
    <circle cx="48" cy="56" r="18" fill="#A67C52"/>
    <text class="listTitle" x="76" y="47" fill="#F6F0E7">Nexora Market</text>
    <text class="listMeta" x="76" y="66" fill="#C2BAAE">Operational workspace</text>
    <rect x="18" y="116" width="178" height="42" rx="16" fill="#EDE1CE"/>
