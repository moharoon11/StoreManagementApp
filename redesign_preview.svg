  <rect x="586" y="1036" width="592" height="36" rx="18" fill="#FFFFFF" stroke="#D8CEBF"/>
  <text class="chip" x="882" y="1059" text-anchor="middle" fill="#57685A">Cards auto-shift between 3, 2, and 1 columns instead of forcing narrow widths.</text>

  <text class="frameLabel" x="1288" y="170">RESPONSIVE MOBILE</text>
  <g filter="url(#shadow)">
    <rect x="1240" y="190" width="262" height="550" rx="42" fill="#1E2328"/>
    <rect x="1252" y="202" width="238" height="526" rx="34" fill="#F7F2EA"/>
    <rect x="1330" y="212" width="80" height="16" rx="8" fill="#2C323A"/>
  </g>

  <g transform="translate(1270 246)">
